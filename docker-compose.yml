services:
  fithub.endpoints:
    image: ${DOCKER_REGISTRY-}fithubendpoints
    build:
      context: .
      dockerfile: FitHub.Endpoints/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000  
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # Collector gRPC endpoint for OTLP
      - "6831:6831/udp"   # UDP for Jaeger agent
      - "4318:4318" 